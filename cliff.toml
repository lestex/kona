# git-cliff: CHANGELOG.md and the release notes, from the commit log.
#
#   make changelog TAG=v0.1.0   # rewrite CHANGELOG.md, pending commits under v0.1.0
#   git cliff --latest          # just the newest section, which is what the
#                               # release workflow hands to goreleaser
#
# kona's commit messages are plain sentences, not conventional commits, so
# every commit is listed as written; only merges are dropped.

[changelog]
header = """
# Changelog

Every release, newest first. Generated from the commit log by
[git-cliff](https://git-cliff.org); run `make changelog` rather than
editing this file by hand.

"""

body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}\n
"""

trim = true

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^merge ", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
