# Shares one Venus GPU between pods by memory capacity. Each replica claims
# 8Gi of the GPU's memory and runs the compute test; on an 18 GiB Mac the
# GPU has 18Gi, so two replicas run side by side and the third stays Pending.
#   make -C examples/vulkan-compute image load
#   kubectl apply -f examples/vulkan-compute/vulkan-shared.yaml
#   kubectl get pods -l app=vulkan-shared
#
# The amount is accounting, not isolation: Venus does not limit what a pod
# allocates. A claim that requests no amount gets the whole GPU.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: kona-gpu-8gi
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: kona-gpu
            capacity:
              requests:
                memory: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulkan-shared
spec:
  replicas: 3
  selector:
    matchLabels: {app: vulkan-shared}
  template:
    metadata:
      labels: {app: vulkan-shared}
    spec:
      tolerations:
        - {key: kona.dev/gpu, operator: Exists, effect: NoSchedule}
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: kona-gpu-8gi
      containers:
        - name: vkcompute
          image: ghcr.io/lestex/kona-vulkan-compute:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo KONA_VENUS_MEMORY=$KONA_VENUS_MEMORY; vkcompute && exec sleep infinity"]
          resources:
            claims:
              - name: gpu
