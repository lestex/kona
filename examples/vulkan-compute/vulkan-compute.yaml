# Vulkan compute smoke test: dispatches a compute shader over 1M uints on the
# Venus GPU and verifies every result. Build and load the image first:
#   make -C examples/vulkan-compute image load
#   kubectl apply -f examples/vulkan-compute/vulkan-compute.yaml
#   kubectl logs -f job/vulkan-compute
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: kona-gpu-compute
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: kona-gpu
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vulkan-compute
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - {key: kona.dev/gpu, operator: Exists, effect: NoSchedule}
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: kona-gpu-compute
      containers:
        - name: vkcompute
          image: ghcr.io/lestex/kona-vulkan-compute:v0.1.0
          imagePullPolicy: IfNotPresent
          resources:
            claims:
              - name: gpu
