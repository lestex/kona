# Runs `vulkaninfo --summary` on a Venus GPU allocated through DRA.
#   kubectl apply -f examples/vulkaninfo.yaml
#   kubectl logs -f pod/vulkaninfo
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: kona-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: kona-gpu
---
apiVersion: v1
kind: Pod
metadata:
  name: vulkaninfo
spec:
  restartPolicy: Never
  # GPU workers are tainted; the claim (not a nodeSelector) decides placement.
  tolerations:
    - {key: kona.dev/gpu, operator: Exists, effect: NoSchedule}
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: kona-gpu
  containers:
    - name: vulkaninfo
      # Fedora + the Mesa build that works with krunkit's Venus (images/vulkan).
      image: ghcr.io/lestex/kona-vulkan:25.3.6-102.fc44
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "env | grep -E '^(VK_DRIVER_FILES|KONA_VENUS_DEVICE)='; ls -l /dev/dri; vulkaninfo --summary"]
      resources:
        claims:
          - name: gpu
