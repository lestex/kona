site_name: kona
site_description: Kubernetes on Apple silicon, one Apple container VM per node.
site_url: https://alarin.dev/kona/
repo_url: https://github.com/lestex/kona
repo_name: lestex/kona
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  icon:
    logo: material/kubernetes
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  # Drops "Made with Material for MkDocs" from the footer.
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lestex/kona
      name: kona on GitHub

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
  - Guide:
      - Clusters: guide/clusters.md
      - k3s or kubeadm: distros.md
      - Stop, start, verify: lifecycle.md
      - Loading images: registry.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - Command line: reference/cli.md
      - Failure modes: failure-modes.md
      - Versions: versions.md
  - Design:
      - Networking: networking.md
      - Guest kernel: kernel.md
      - Host tool CLI surface: cli-surface.md
      - Gates: gates.md
      - Phase 0 playground: playground.md
  - Development:
      - Building and testing: development.md
      - Releasing: release.md
