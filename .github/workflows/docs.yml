# Builds the docs site on every docs change and publishes it to GitHub Pages
# (https://alarin.dev/kona/) from a v* tag only: readers run the
# released binary, so main would document behavior they don't have yet.
# Pages must be set to "GitHub Actions" in Settings -> Pages.
name: docs

on:
  push:
    # Both refs: a push trigger naming only branches ignores tags entirely.
    branches: [main]
    tags: ["v*"]
    # Skips code-only pushes. Not evaluated for tags, so a release always
    # publishes.
    paths:
      - docs/**
      - website/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - website/**
      - .github/workflows/docs.yml
  # Redeploy a release's docs without moving the tag: run it on the tag ref.
  workflow_dispatch:

# Only deploy needs Pages write, and it asks for that itself, so pull
# request builds never get it.
permissions:
  contents: read

# Keyed by ref, so a push to main never cancels a tag's deployment.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # enableGitInfo: "last updated" dates come from the history.
          fetch-depth: 0

      # Hugo fetches the Hextra theme as a Go module (website/go.mod).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: website/go.mod
          cache-dependency-path: website/go.sum

      # Pinned, and checked against the checksums Hugo publishes.
      - name: Install Hugo
        run: |
          base=https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}
          tgz=hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          curl -fsSLO "$base/$tgz"
          echo "${HUGO_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo" && tar -xzf "$tgz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
        env:
          HUGO_VERSION: 0.169.0
          HUGO_SHA256: c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d

      # A broken page link (website/layouts/_markup/render-link.html) or any
      # warning fails the build instead of becoming a 404 someone finds later.
      - run: make docs-build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/public

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
